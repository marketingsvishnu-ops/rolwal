<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONCORE — Fitness Poster</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080808;
    color:#fff;
    font-family:Montserrat,sans-serif;
}

/* MAIN POSTER */

.poster{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(110deg,#050505 0%,#101010 45%,#080808 100%);
}

/* RED DIAGONAL SHAPE */

.poster::before{
    content:"";
    position:absolute;
    width:55%;
    height:150%;
    right:-18%;
    top:-25%;
    background:#e50914;
    transform:rotate(17deg);
    opacity:.9;
}

.poster::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            135deg,
            transparent 0,
            transparent 70px,
            rgba(255,255,255,.025) 71px,
            transparent 72px
        );
}
